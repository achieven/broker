name: Node.js Package

on:
  push:
    branches: [main]

# Least privilege by default; the publish job opts in to more below
permissions:
  contents: read

# Never run two publishes at once (avoids version races)
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@achieven'
      # --ignore-scripts: a compromised dependency can't run install hooks
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # referenced by the repo's .npmrc
      - run: npm test

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump commit + tag
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # token isn't left in .git/config for later steps
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@achieven'
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If the version in package.json is already published, bump patch by 1 (0.1.8 -> 0.1.9).
      # Otherwise publish it as-is.
      - name: Bump version if already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already published, bumping patch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch -m "chore: release %s [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:main --follow-tags
          else
            echo "$VERSION not published yet, publishing as-is"
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
