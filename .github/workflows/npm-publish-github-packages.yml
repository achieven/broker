name: Node.js Package

on:
  push:
    branches: ['**'] # tests run on every branch; only main publishes (see publish-gpr)

# Least privilege by default; the publish job opts in to more below
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@achieven'
      # --ignore-scripts: a compromised dependency can't run install hooks
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # referenced by the repo's .npmrc
      # The Kafka client is native: run the install script of this one package only (downloads the prebuilt binding, else compiles it)
      - run: npm rebuild @confluentinc/kafka-javascript
      - run: npm test

  # Real 3-broker Kafka + Mongo + MySQL via docker compose (test/docker-compose.yml); takes ~5 minutes.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@achieven'
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm rebuild @confluentinc/kafka-javascript # native binding, see the unit-test job
      - run: npm run test:integration
      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f test/docker-compose.yml logs --no-color --tail 200
      - name: Tear down containers
        if: always()
        run: docker compose -f test/docker-compose.yml down -v

  # Once unit + integration tests pass on a feature branch, open a PR into main (never merges it).
  # Needs: repo Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
  open-pr:
    needs: [test, integration-test]
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # --fill reads the branch's commits to build the title and description
          persist-credentials: false
      - name: Open pull request if none is open for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          OPEN=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq length)
          if [ "$OPEN" != "0" ]; then
            echo "A pull request for $BRANCH is already open, nothing to do"
          else
            gh pr create --base main --head "$BRANCH" --fill
          fi

  publish-gpr:
    needs: [test, integration-test]
    if: github.ref == 'refs/heads/main'
    # Never run two publishes at once (avoids version races)
    concurrency:
      group: publish-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump commit + tag
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # token isn't left in .git/config for later steps
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@achieven'
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If the version in package.json is already published, bump patch by 1 (0.1.8 -> 0.1.9).
      # Otherwise publish it as-is.
      - name: Bump version if already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already published, bumping patch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch -m "chore: release %s [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" HEAD:main --follow-tags
          else
            echo "$VERSION not published yet, publishing as-is"
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
